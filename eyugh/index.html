<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>EYUGH</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #000;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        overflow: hidden;
        touch-action: manipulation; /* Prevents double-tap to zoom */
        -webkit-tap-highlight-color: transparent;
      }

      /* 3D Base for the button */
      .button-base {
        background: linear-gradient(135deg, #444, #222);
        border-radius: 50%;
        padding: 25px;
        box-shadow:
          0 15px 30px rgba(0, 0, 0, 0.9),
          inset 0 2px 5px rgba(255, 255, 255, 0.2),
          inset 0 -5px 15px rgba(0, 0, 0, 0.8);
        border: 2px solid #111;
        margin-bottom: 120px; /* Moves the button up */
      }

      /* The physical button */
      .eyugh-button {
        appearance: none;
        -webkit-appearance: none;
        outline: none;
        border: none;
        background:
          url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.5'/%3E%3C/svg%3E"),
          radial-gradient(circle at 50% 10%, #ff99cc, #ff3399, #b30059);
        background-blend-mode: overlay, normal;
        color: white;
        font-size: 3.5rem;
        font-weight: 900;
        letter-spacing: 2px;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        cursor: pointer;
        box-shadow:
          0 20px 0 #800040,
          /* Button thickness */ 0 30px 25px rgba(0, 0, 0, 0.8),
          /* Drop shadow */ inset 0 -10px 20px rgba(0, 0, 0, 0.3); /* Inner bottom shadow */
        transition:
          transform 0.1s ease-out,
          box-shadow 0.1s ease-out;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        z-index: 10;
      }

      /* Glistening/glossy highlight */
      .eyugh-button::before {
        content: "";
        position: absolute;
        top: 4%;
        left: 15%;
        width: 70%;
        height: 35%;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.85),
          rgba(255, 255, 255, 0)
        );
        border-radius: 50% 50% 30% 30% / 50% 50% 20% 20%;
        pointer-events: none;
      }

      /* Active / Pressed state */
      .eyugh-button:active,
      .eyugh-button.active {
        transform: translateY(14px);
        box-shadow:
          0 6px 0 #800040,
          /* Reduced thickness */ 0 10px 10px rgba(0, 0, 0, 0.9),
          /* Reduced drop shadow */ inset 0 -5px 15px rgba(0, 0, 0, 0.4);
        background:
          url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.5'/%3E%3C/svg%3E"),
          radial-gradient(circle at 50% 10%, #ff80bf, #e6008a, #99004d);
        background-blend-mode: overlay, normal;
      }

      /* Flying sparkles */
      .sparkle-star {
        position: absolute;
        pointer-events: none;
        z-index: 20;
        font-size: 24px; /* Star size */
        color: white;
        text-shadow:
          0 0 10px #ff66b3,
          0 0 20px #ff3399;
        animation: sparkle-anim 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }

      @keyframes sparkle-anim {
        0% {
          transform: translate(-50%, -50%) scale(0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty)))
            scale(1.5) rotate(180deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body ontouchstart="">
    <div class="button-base">
      <button class="eyugh-button" id="playBtn">EYUGH</button>
    </div>

    <script>
      const playBtn = document.getElementById("playBtn");

      // --- Web Audio API for Zero Latency ---
      let audioCtx;
      let audioBuffer;
      let useFallback = false;
      const fallbackAudio = new Audio("eyugh.mp3");
      fallbackAudio.preload = "auto"; // Preload for fallback

      // Fetch and decode the audio into memory immediately when the page loads
      async function loadAudio() {
        try {
          // Note: fetch() will fail if the user opens the file:// directly in their browser due to CORS.
          const response = await fetch("eyugh.mp3");
          if (!response.ok) throw new Error("Network response was not ok");

          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const arrayBuffer = await response.arrayBuffer();
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (err) {
          console.warn(
            "Web Audio API fetch failed (likely due to running via file://). Falling back to standard Audio.",
            err,
          );
          useFallback = true;
        }
      }

      loadAudio();

      function playSound() {
        if (useFallback) {
          const clone = fallbackAudio.cloneNode();
          clone
            .play()
            .catch((err) => console.log("Fallback audio play error:", err));
          return;
        }

        if (!audioCtx || !audioBuffer) return;

        // Browsers pause audio contexts until the user interacts with the page
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        // Create a temporary source node to play the decoded buffer instantly
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        source.start(0);
      }
      // ---------------------------------------

      function triggerSparkles() {
        const rect = playBtn.getBoundingClientRect();
        // Get absolute position for center of the button
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        // Create a bunch of sparkles
        for (let i = 0; i < 15; i++) {
          const sparkle = document.createElement("div");
          sparkle.classList.add("sparkle-star");
          sparkle.innerHTML = "✨"; // Star emoji for a sparkle

          // Start from center
          sparkle.style.left = centerX + "px";
          sparkle.style.top = centerY + "px";

          // Calculate random explosion physics
          const angle = Math.random() * Math.PI * 2;
          // Explode outwards past the button bounds (which is 250px wide)
          const distance = Math.random() * 150 + 100;
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance;

          sparkle.style.setProperty("--tx", `${tx}px`);
          sparkle.style.setProperty("--ty", `${ty}px`);

          document.body.appendChild(sparkle);

          // Cleanup DOM after animation
          setTimeout(() => {
            sparkle.remove();
          }, 500);
        }
      }

      // Use pointer events for immediate response on mobile/touch screens
      playBtn.addEventListener("pointerdown", (e) => {
        // Only trigger on left click or touch, ignore right clicks
        if (e.button !== 0 && e.pointerType === "mouse") return;

        playBtn.classList.add("active");

        triggerSparkles();
        playSound();
      });

      playBtn.addEventListener("pointerup", () => {
        playBtn.classList.remove("active");
      });

      playBtn.addEventListener("pointerleave", () => {
        playBtn.classList.remove("active");
      });

      // Prevent context menu from popping up on long press on mobile
      playBtn.addEventListener("contextmenu", (e) => {
        e.preventDefault();
      });
    </script>
  </body>
</html>
